[package]
name = "MMA"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-stream = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
thiserror = "2.0.20"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.10.2"

